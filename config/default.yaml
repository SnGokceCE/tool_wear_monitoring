# Projenin tek yapılandırma kaynağı.
# Sabitleri koda gömmüyoruz: hem raporda tek yerden okunabilsin,
# hem de veri setinden doğrulandıkça buradan güncellensin.

paths:
  data_raw: data/raw
  data_processed: data/processed
  runs: runs
  reports: reports

# ---------------------------------------------------------------- PHM 2010
# Birincil veri seti. Eğitim ve ana sonuçlar burada üretilir.
phm2010:
  root: data/raw/phm2010

  # Etiketli kesiciler. c2, c3, c5 etiketsiz olduğu için denetimli
  # çalışmada kullanılamaz (ileride yarı-denetimli denenirse işe yarayabilir).
  labelled_cutters: [c1, c4, c6]
  unlabelled_cutters: [c2, c3, c5]

  # Sinyal kanalları — ham csv'deki sütun sırası.
  channels: [force_x, force_y, force_z, vib_x, vib_y, vib_z, ae_rms]

  # Ortak kanallar: NASA'ya transfer denemesinde (Faz 07) yalnızca bunlar
  # kullanılabilir, çünkü NASA'da kuvvet sensörü yok.
  shared_channels: [vib_x, vib_y, vib_z, ae_rms]

  sampling_rate_hz: 50000

  # 2026-08-27'de inen veriden doğrulandı:
  #   6 kesici × 315 geçiş; c1, c4, c6 etiketli (315'er etiket = 945)
  #   ağız sayısı 3 (wear dosyasında flute_1..3)
  #   geçiş dosyası 127.399 satır × 7 kanal ≈ 2,55 s @ 50 kHz
  #   VB üç kesicide de monoton artıyor - izotonik varsayım geçerli
  #   VB tepe değerleri: c1 172,7 / c4 210,9 / c6 234,7 um
  #     -> "deneyler 150 um'de sonlandırıldı" bilgisi bu dosyalar için doğru
  #        değil; 150 um bir EŞİK seçimi, veri onun ötesine geçiyor.
  #   ağızlar arası saçılım ortalaması: c1 10,3 / c4 7,9 / c6 20,5 um
  spindle_rpm: 10400
  flutes: 3
  feed_mm_per_min: 1555
  depth_of_cut_axial_mm: 0.2
  material: "paslanmaz çelik"

  # Etiket birimi: wear.csv değerleri 10^-3 mm, yani mikrometre.
  wear_unit: um
  # Ağızlar arası birleştirme. "max" = VBmax, literatürdeki standart.
  # "mean" alternatifi ölçüm gürültüsüne karşı daha kararlı olabilir;
  # ikisi de raporlanacak.
  wear_aggregation: max

# ---------------------------------------------------------------- NASA
#
# ROL DEĞİŞTİ (2026-08-28). Başlangıçta ikincil veri setiydi ve eğitimde
# kullanılmıyordu - Faz 07'deki "hiç görülmemiş tezgâh" sınavı için
# ayrılmıştı.
#
# Sonra istenen girdi tanımına kesme parametreleri (malzeme, ilerleme,
# kesme derinliği) eklendi. Bu değişkenler PHM'de SABİT olduğu için sıfır
# bilgi taşıyorlar; ancak NASA'da değişiyorlar. Dolayısıyla NASA eğitime
# alınmak zorunda kaldı.
#
# Sınav da buna göre değişti: "veri seti dışı" yerine "koşul dışı" ve
# "malzeme dışı". İkincisi Tomtaş bağlamında daha değerli - alüminyum
# sorusuna en yakın kanıt.
#
# Model B-1 (sadece NASA) teslim edilecek yapıdır. Model B-2'de PHM ile
# birleştirme denendi ve reddedildi (bkz. README, Faz 04c).
nasa:
  root: data/raw/nasa_milling
  mat_file: mill.mat
  channels: [smcAC, smcDC, vib_table, vib_spindle, AE_table, AE_spindle]
  shared_channels: [vib_table, vib_spindle, AE_table, AE_spindle]
  wear_unit: mm
  # Artık eğitimde kullanılıyor - yukarıdaki role bakınız.
  use_for_training: true

  # 2026-08-27'de inen veriden doğrulandı:
  #   167 koşu, 146'sında VB etiketi var, 16 vaka
  #   koşu başına 9000 örnek × 6 kanal
  #   VB aralığı 0.00 - 1.53 mm  (üst değerler ISO sınırının çok üstünde, aykırı)
  #   material kodu: 1 = dökme demir, 2 = çelik
  sampling_rate_hz: 250
  samples_per_run: 9000
  spindle_rpm: 826

  # Vaka 6'da tek koşu var - bilinen veri düzensizliği, kullanılabilir değil.
  known_bad_cases: [6]

  # NASA için aşınma eşiği PHM'den farklı. PHM'in 150 um'si o deneyin kendi
  # sınırıydı; NASA 1530 um'ye kadar çıkıyor. Burada ISO 8688'in genel
  # kriteri (VB = 0,3 mm) kullanılıyor - 146 etiketin 69'u bu değerin üstünde,
  # yani eşik veriyi makul biçimde ikiye bölüyor.
  wear_limit_um: 300

  # Malzeme kodları (veriden doğrulandı)
  material_codes:
    1: "dökme demir"
    2: "çelik"

# ---------------------------------------------------------------- Transfer
# Faz 07'nin temel kısıtı: iki veri setinin frekans bantları ÖRTÜŞMÜYOR.
#
#   PHM 2010 : iğ 173,3 Hz  |  diş geçişi 520 Hz  |  Nyquist 25.000 Hz
#   NASA     : iğ  13,8 Hz  |                     |  Nyquist    125 Hz
#
# PHM'in bilgi taşıyan bandı (173 Hz ve üstü) NASA'da fiziksel olarak
# temsil edilemiyor. Dolayısıyla ham sinyali yeniden örnekleyip transfer
# etmek mümkün değil.
#
# Çözüm: frekans yerine MERTEBE (order) alanında çalışmak. Öznitelikler
# iğ frekansının katları olarak tanımlanırsa iki tezgâh karşılaştırılabilir
# hale gelir. NASA'nın izin verdiği üst sınır 125 / 13,8 ≈ 9 mertebe,
# bu yüzden transfer denemesi ilk 8 mertebeyle sınırlı.
transfer:
  domain: order            # frekans değil, iğ frekansının katları
  max_order: 8
  channels: [vibration, acoustic_emission]

# ---------------------------------------------------------------- Değerlendirme
evaluation:
  # Kesici bazında bölme. Rastgele pencere bölmesi sızıntı yaratır:
  # komşu pencereler neredeyse aynıdır, model ezberler.
  split: leave_one_cutter_out

  # Aşınma sınırı. PHM 2010 deneyleri bu değerde sonlandırılmıştır.
  # (ISO 8688'in genel kriteri 300 um'dir; burada veri setinin kendi sınırı geçerli.)
  wear_limit_um: 150

  metrics: [mae_um, rmse_um, overshoot_um, crossing_delay_cuts]

# ---------------------------------------------------------------- Kabul kriterleri
#
# 2026-08-28'de REVİZE EDİLDİ. Faz 00'da konan "gecikme <= 5 geçiş" hedefi
# veriyle ölçüldüğünde ULAŞILAMAZ çıktı:
#
#   kesici | eşik civarı eğim | 5 geçiş için gereken doğruluk | ölçüm gürültüsü
#   -------|------------------|-------------------------------|----------------
#   c1     | 0,581 um/geçiş   | 2,9 um                        | 10,3 um
#   c4     | 1,242 um/geçiş   | 6,2 um                        |  7,9 um
#   c6     | 0,954 um/geçiş   | 4,8 um                        | 20,5 um
#
# Yani hedef, etiketin KENDİ ölçüm gürültüsünün altında bir doğruluk istiyordu.
# Hiçbir model bunu sağlayamaz; sağlıyor görünüyorsa sızıntı vardır.
#
# Ayrıca "gecikme (geçiş)" metriği eğrinin eğimine bağlı olduğu için kesiciler
# arasında karşılaştırılamıyor: düz bölgede 15 um hata 26 geçiş, dik bölgede
# 12 geçiş kayması demek. Yerine eğimden bağımsız "overshoot" kullanılıyor:
# alarm çaldığında gerçek aşınmanın eşiği kaç um aştığı.
acceptance:
  max_mae_um: 15.0            # ölçüm gürültüsü tabanına yakın; iddialı hedef
  max_overshoot_um: 25.0      # ~2x ölçüm gürültüsü; eşiğin %17 üstü
  must_beat_naive_baseline: true

  # Bilgi amaçlı: eski hedef ve neden bırakıldığı yukarıda.
  retired_max_crossing_delay_cuts: 5

# ---------------------------------------------------------------- Karar mantığı
# Model bir VB sayısı üretir; "takımı değiştir" demek ayrı bir karardır.
#
# Hata türlerinin maliyeti simetrik DEĞİL:
#   kaçırılan aşınma -> aşınmış takım kesmeye devam eder, parça hurdaya gider
#   yanlış alarm     -> sağlam takım erken değişir, takım ömrü israf olur
#
# Aşağıdaki oran bir İŞLETME kararıdır, teknik değil. Gerçek üretimde parça
# maliyeti ile takım maliyetinden çıkar. 5:1 makul bir başlangıç değeri;
# havacılık parçasında muhtemelen daha yüksektir.
decision:
  cost_missed: 5.0
  cost_false_alarm: 1.0

  # Eşik adaylarının tarandığı aralık: sınırın %50 altı - %50 üstü.
  search_span: 0.5

  # Ardışık onay adayları: alarm için üst üste kaç geçiş eşiği aşmalı.
  consecutive_candidates: [1, 2, 3]

# ---------------------------------------------------------------- Teslim (Faz 06)
#
# Nihai model B-1'dir ve 145 satırın TAMAMIYLA eğitilir - katlama ayrılmaz.
# Katlamalar performansı ÖLÇMEK içindi (Faz 04b); ölçüm bittikten sonra veriyi
# eğitim dışında tutmanın bir faydası kalmaz, sadece model zayıflar.
serving:
  # ---- girdi kümesi ----
  # "sensor+param+time" (149 öznitelik) | "param+time" (5 öznitelik)
  #
  # Varsayılan sensörlü olan. Faz 04b'de "param+time" BİLİNEN koşullarda daha
  # iyiydi (108/114 vs 138/164 um), ama teslim senaryosu bilinen koşul değil:
  # sahada malzeme aluminyum, egitim verisinde aluminyum yok. Yani her saha
  # tahmini "malzeme-disi" sinavina denk gelir ve orada tablo tersine doner:
  #
  #   param+time           388 um  <- naif tabanin (309) ALTINDA
  #   sensor+param+time    271 um  <- naif tabanin ustunde
  feature_set: "sensor+param+time"

  # ---- alarm esigi ----
  # Esik iki ayri kurguyla kalibre edilir ve IKISI DE pakete yazilir:
  #
  #   case     : takim bazinda ic capraz dogrulama (leave-one-tool-out),
  #              15 katlama. AKTIF olan budur.
  #   material : malzeme bazinda ic capraz dogrulama (dokme demirde egit,
  #              celikte olc), 2 katlama. min_groups=2 ile zorlanir.
  #              Pakette ve kunyede durur ama VARSAYILAN DEGIL.
  #
  # NEDEN case AKTIF (2026-08-31'de olculdu):
  #
  # material kalibrasyonu 156 um veriyor - siniri n neredeyse yarisi. Bu
  # deger olculdugunde operasyonel olarak savunulamaz cikti:
  #
  #   15/15 takimda alarm omrun ilk yarisinda caliyor
  #    9/15 takimda alarm DAHA ILK GECISTE caliyor
  #   ortalama alarm konumu: takim omrunun %12'si
  #
  # Yani "her takimi takar takmaz at" kuralina denk; bunun icin modele gerek
  # yok. Iki sebebi var: (a) yalnizca 2 katlamayla hesaplaniyor, gurultulu;
  # (b) maliyet fonksiyonu yanlis alarmi GECIS basina sayiyor ve takim
  # bazinda erken degistirmenin bedelini hic olcmuyor, bu yuzden esigi dibe
  # itiyor.
  #
  # GELECEK CALISMA: maliyet modeline takim bazinda omur israfi terimi
  # eklendiginde material kalibrasyonu yeniden degerlendirilmeli.
  calibration: "case"   # "case" | "material"

  # Kalibrasyonda ardisik onay (k) da aranir. Faz 09 her katlamada k=1 secti;
  # mekanizma yine de korunuyor.
  tune_consecutive: true

  # Paketin yazilacagi yerler. Ikili dosya git disinda (yeniden uretilebilir),
  # kunye ve taban cizgileri git icinde (metin, denetlenebilir).
  package_dir: runs/model_b1
  manifest: reports/model_b1_package.json
  baselines: reports/model_b1_baselines.csv

random_seed: 42
